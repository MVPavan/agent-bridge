[project]
name = "agent-bridge"
version = "0.0.1"
description = "Bidirectional Claude-Claude-Codex development bridge. See docs/architecture.md."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Runtime dependencies. Pinned loosely; CP3 baseline only.
dependencies = [
    "claude-agent-sdk>=0.2,<1.0",
    "aiosqlite>=0.20,<1.0",
    "pydantic>=2.6,<3.0",
    "structlog>=24.0,<26.0",
    "mcp>=1.0,<2.0",
    "click>=8.1,<9.0",
]

[project.scripts]
agent-bridge = "agent_bridge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["state", "scratchpad"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]  # tests can be wide

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "claude_agent_sdk.*",
    "codex_client.*",
    "aiosqlite.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: integration tests that spawn real Claude or Codex sessions (skipped by default; opt in with -m live)",
]
addopts = "-m 'not live'"
